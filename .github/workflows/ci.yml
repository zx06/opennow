name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o opennow ./cmd/opennow
      - name: Docker build
        run: docker build -t opennow:ci .
